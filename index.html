
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Adam Asmaca Online</title>
<style>
:root{
 --bg:#0b1020;
 --card:#171e33;
 --border:#303b57;
 --text:#f5f7ff;
 --muted:#a4b0ca;
 --accent:#8b5cf6;
 --green:#34d399;
 --red:#fb7185;
}
*{box-sizing:border-box}
body{
 margin:0;
 background:radial-gradient(circle at top,#202b50,var(--bg) 65%);
 color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 min-height:100vh;
}
main{
 max-width:850px;
 margin:auto;
 padding:22px 15px 70px;
}
header{text-align:center;margin-bottom:25px}
.logo{font-size:42px;margin-bottom:8px}
h1{font-size:29px;margin:5px 0;font-weight:850}
h2{font-size:21px;margin:8px 0 18px}
h3{font-size:17px}
p{line-height:1.55}
.subtitle,.muted,.hint{color:var(--muted)}
.subtitle{font-size:14px}
.card,.glass{
 background:var(--card);
 border:1px solid var(--border);
 border-radius:20px;
 padding:20px;
 margin-bottom:15px;
 box-shadow:0 10px 35px #0002;
}
label{display:block;font-size:14px;margin:15px 0 7px}
input,select,textarea{
 display:block;
 width:100%;
 background:#0e1528;
 color:white;
 border:1px solid #455170;
 border-radius:12px;
 padding:14px;
 font-size:16px;
 margin-top:7px;
 font-family:inherit;
}
textarea{min-height:135px;resize:vertical}
input:focus,textarea:focus,select:focus{
 outline:2px solid var(--accent);
}
button{
 border:0;
 border-radius:13px;
 padding:14px 18px;
 background:var(--accent);
 color:white;
 font-size:16px;
 font-weight:750;
 cursor:pointer;
}
button:disabled{opacity:.4;cursor:not-allowed}
.btn{width:100%;margin-top:13px}
.secondary{background:#303b57}
.small{width:auto;padding:9px 13px;font-size:13px}
.topline{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:12px;
 margin-bottom:18px;
}
.tag{
 display:inline-block;
 background:#34265b;
 color:#d9c9ff;
 border-radius:20px;
 padding:7px 12px;
 font-size:12px;
 font-weight:800;
}
.room-code{
 font-size:42px;
 font-weight:900;
 letter-spacing:7px;
 color:#c4b5fd;
 margin:18px 0;
}
.center{text-align:center}
.notice{
 background:#582537;
 border:1px solid var(--red);
 color:#ffe4e6;
 padding:14px;
 border-radius:13px;
 margin:15px 0;
}
.info{
 background:#222d49;
 border-radius:13px;
 padding:14px;
 margin:15px 0;
 color:#dbe4fa;
}
.scoreboard{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
 gap:10px;
 margin:15px 0;
}
.player{
 background:#10182c;
 border:1px solid #35415d;
 border-radius:15px;
 padding:15px;
}
.player.me{border-color:var(--accent)}
.name{font-weight:750;overflow-wrap:anywhere}
.balance{font-size:23px;font-weight:850;margin-top:8px}
.word{
 display:flex;
 justify-content:center;
 flex-wrap:wrap;
 gap:7px;
 margin:24px 0;
}
.letter{
 min-width:29px;
 height:42px;
 display:flex;
 align-items:center;
 justify-content:center;
 border-bottom:3px solid #a78bfa;
 font-size:24px;
 font-weight:850;
}
.space{width:17px;border:0}
.keyboard{
 display:flex;
 flex-wrap:wrap;
 justify-content:center;
 gap:6px;
 margin:20px 0;
}
.key{
 width:calc((100% - 48px)/7);
 min-width:35px;
 max-width:53px;
 padding:12px 2px;
 background:#34415f;
 border-radius:9px;
 font-size:15px;
}
.key.used{opacity:.3}
.hangman{
 width:220px;
 height:230px;
 display:block;
 margin:10px auto;
}
.hangman line,.hangman circle{
 stroke:#e2e8f0;
 stroke-width:5;
 fill:none;
 stroke-linecap:round;
}
.hangman .base{stroke:#64748b}
.status{
 font-size:13px;
 color:var(--muted);
}
.winner{
 font-size:26px;
 font-weight:850;
 color:var(--green);
 margin:12px 0;
}
.resultrow{
 display:flex;
 justify-content:space-between;
 padding:13px 0;
 border-bottom:1px solid var(--border);
 gap:10px;
}
footer{
 text-align:center;
 color:var(--muted);
 font-size:12px;
 margin-top:30px;
}
@media(max-width:390px){
 .card,.glass{padding:15px}
 .key{min-width:31px;font-size:13px}
 .room-code{font-size:34px}
}
</style>
</head>
<body>
<main>
<header>
<div class="logo">🎯</div>
<h1>ADAM ASMACA</h1>
<div class="subtitle">ONLINE · ARKADAŞLARINLA CANLI OYNA</div>
</header>
<div id="app">
<div class="card center">Oyun yükleniyor...</div>
</div>
<footer>Adam Asmaca Online · Çok Oyunculu Kelime Oyunu</footer>
</main>
<script src="/app.js?v=2" defer></script>
</body>
</html>
